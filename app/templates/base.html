<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}IDX AI Stock Predictions{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="/">IDX AI Stock Lab</a>
      </div>
    </nav>
    <main class="py-5">
      <div class="container">
        {% block content %}{% endblock %}
      </div>
    </main>
    <footer class="bg-dark text-white py-3">
      <div class="container text-center small">
        &copy; {{ 2024 }} IDX AI Stock Lab. Predictions are illustrative only.
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-cL1Y1hYzu3/n6PvJEa3TBUnIFVWMGryuVKyXjH9MuNoMNFcQJUO2c+hJ1ytY1/6w" crossorigin="anonymous"></script>
  </body>
</html>
